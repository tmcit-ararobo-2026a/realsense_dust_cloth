# External map filtering by gn10 localization; all tuning values live here.
/**:
  ros__parameters:
    observed_landing_only: true
    use_sim_time: false
    depth_topic: /camera/camera/depth/image_rect_raw
    camera_info_topic: /camera/camera/depth/camera_info
    color_topic: /camera/camera/color/image_raw
    use_direct_realsense: true
    publish_debug_cloud: false
    publish_static_tf: true
    camera_parent_frame: base_link
    camera_frame: camera_link
    camera_x_offset_m: 0.5
    camera_height_offset_m: 1.0
    camera_pitch_deg: 20.0
    camera_roll_deg: 90.0
    camera_width: 640
    camera_height: 480
    min_x_m: 0.6
    max_x_m: 6.0
    min_y_m: -0.6
    max_y_m: 0.6
    min_z_m: 0.05
    max_z_m: 3.1
    min_depth_m: 0.25
    max_depth_m: 5.5
    enable_ballistic_filter: true
    launch_min_x: 0.8
    launch_max_x: 1.35
    launch_min_y: -0.25
    launch_max_y: 0.18
    launch_min_z: 1.45
    launch_max_z: 2.1
    min_launch_vx: 0.3
    min_launch_move_m: 0.05
    pending_reset_sec: 0.25
    gate_radius_m: 0.7
    max_lost_frames: 8
    min_tracking_points: 12
    landing_min_z: 0.15
    drag_coeff: 0.4
    vel_smoothing_beta: 0.5
    min_flight_vx_m_s: -1.5
    max_vx_m_s: 15.0
    max_abs_vy_m_s: 3.5
    min_vz_m_s: -10.0
    max_vz_m_s: 12.0
    max_flight_duration_sec: 2.5
    min_stationary_move_m: 0.12
    max_stationary_frames: 5
    voxel_size_m: 0.02
    cluster_eps_m: 0.1
    min_cluster_points: 45
    max_cluster_points: 12000
    min_cloth_size_m: 0.05
    max_cloth_size_m: 0.8
    continuity_thresh_m: 0.08
    continuity_min_neighbors: 3
    trajectory_history_sec: 15.0
    enable_color_stream: true
    color_fps: 30
    jpeg_quality: 65
    color_rotation_deg: 90
    depth_fps: 60
    rs_laser_power: -1.0
    rs_exposure_us: -1
    enable_cmd_vel_watch: true
    cmd_vel_topic: /robot/operation/cmd_vel
    cmd_vel_deadband_linear: 0.02
    cmd_vel_deadband_angular: 0.02
    cmd_vel_timeout_sec: 0.25
    stop_settle_sec: 0.1
    landing_position_topic: /cloth/landing_position
    map_frame: map
    map_max_image_age_sec: 0.25
    map_depth_queue_size: 8
    tracking_input_mode: external_dynamic_cloud
    cropped_cloud_topic: /realsense/cropped_cloud
    dynamic_cloud_topic: /realsense/dynamic_cloud
    external_filter_status_topic: /realsense/filter_status
    external_result_timeout_sec: 0.25
    external_poll_sec: 0.02
    external_tracking_keep_radius_m: 0.3
    external_prediction_topic: /cloth/filter_prediction
