# 実機（Jetson + USB RealSense）
# このYAMLが設定の正本です。launchはuse_sim_time / use_direct_realsenseを上書きしません。
/**:
  ros__parameters:

    # --- 1. 実行環境・入力の種類 ---
    use_sim_time: false  # 実機:false / Unity・bag:true。launchはこの値をそのまま全ノードに適用する
    use_direct_realsense: true  # 実機USB直結:true / Unity・bag:false。未対応ビルド時は明示エラー
    input_source: depth  # depth:深度から作成 / cropped_cloud:除去前点群を再投入 / dynamic_cloud:記録済み差分後点群を追跡
    depth_topic: /camera/camera/depth/image_rect_raw  # 深度トピック名 (ROS 2 互換受信用)
    camera_info_topic: /camera/camera/depth/camera_info  # カメラ内部パラメータトピック名
    color_topic: /camera/color/image_raw  # カラー画像トピック名
    cropped_replay_topic: /bag/realsense/cropped_cloud  # cropped_cloud再投入用。bag再生で元トピックをここへremapし、入出力ループを防ぐ

    # --- 2. RealSense接続・画像配信 ---
    camera_width: 640  # 深度画像幅 [px]
    camera_height: 480  # 深度画像高さ [px]
    depth_fps: 60  # 深度フレームレート [fps] (高速飛翔体の追跡には 60fps 推奨)
    color_fps: 30  # カラーフレームレート [fps]
    rs_laser_power: -1.0  # 負値:SDKが返す出力範囲の最大値 / 0:消灯 / 正値:指定出力
    rs_exposure_us: -1  # Depth 露光時間 [us] (-1: 自動露出)
    publish_raw_depth: false  # USB直結時の生深度配信。Jetson内bag記録時のみtrue推奨（60fpsで約295Mbps）
    enable_color_stream: false  # RViz 可視化用カラー画像の配信有効化 (trueだと非圧縮映像でWi-Fi帯域約220Mbpsを消費するため実機はfalse推奨)
    color_rotation_deg: 90  # カメラ縦置き設置に合わせた画像回転角 [deg]
    jpeg_quality: 65  # RViz/Web 配信向け JPEG 圧縮品質 (1-100)
    realsense_wait_timeout_ms: 1000  # 実機カメラのフレーム待機タイムアウト [ms]

    # --- 3. カメラ取付と座標系 ---
    publish_static_tf: true  # カメラ固定TFを配信する。bagの同じTFを再生する場合はfalse
    camera_parent_frame: base_link  # 親座標系 (ロボット車体中心)
    camera_frame: camera_link  # カメラ座標系名
    depth_optical_frame: camera_depth_optical_frame  # 深度画像の光学座標系名
    color_optical_frame: camera_color_optical_frame  # カラー画像の光学座標系名。TFと画像ヘッダーで共通に使用
    cloth_tf_frame: flying_cloth  # 雑巾の最後の実測位置を表示するTFの子座標系名
    camera_x_offset_m: 0.50  # 車体中心からカメラレンズまでの前後オフセット [m] (前方: +, 後方: -)
    camera_height_offset_m: 1.00  # 地面からカメラレンズ中心までの高さオフセット [m]
    camera_pitch_deg: 20.0  # カメラ仰角 [deg]。この実装では正の値が上向き
    camera_roll_deg: 90.0  # カメラ縦置き設置の回転角 [deg] (横置き: 0度, 縦置き: 90度)

    # --- 4. 追跡する空間ROI・深度ノイズ除去 ---
    min_x_m: 0.60  # 探索空間 X 下限 (前方) [m] (ロボット本体直前の点群を除外)
    max_x_m: 5.00  # 探索空間 X 上限 (前方) [m] (追跡対象とする最遠到達距離)
    min_y_m: -0.60  # 探索空間 Y 下限 (右側) [m]
    max_y_m: 0.60  # 探索空間 Y 上限 (左側) [m]
    min_z_m: 0.05  # 探索空間 Z 下限 [m]。着地高さまで観測できる余裕を確保し、床除去はgn10と整合させる
    max_z_m: 4.00  # 探索空間 Z 上限 [m]
    min_depth_m: 0.25  # カメラ最小計測深度 [m]
    max_depth_m: 5.30  # カメラ最大計測深度 [m]
    continuity_radius_px: 2  # 深度連続性を調べる上下左右の距離 [px]
    continuity_thresh_m: 0.08  # 点群連続性判定距離閾値 [m]
    continuity_min_neighbors: 3  # 連続性認定最小近傍点数

    # --- 5. 射出判定 ---
    launch_min_x: 0.80  # 発射判定ボックス X 下限 [m] (発射口の前端位置)
    launch_max_x: 1.35  # 発射判定ボックス X 上限 [m]
    launch_min_y: -0.25  # 発射判定ボックス Y 下限 [m]
    launch_max_y: 0.30  # 発射判定ボックス Y 上限 [m]
    launch_min_z: 1.45  # 発射判定ボックス Z 下限 [m] (発射口の高さ)
    launch_max_z: 2.10  # 発射判定ボックス Z 上限 [m]
    min_launch_vx: 0.30  # 射出認定最小前方初速 [m/s]
    min_launch_move_m: 0.05  # 射出認定最小前方変位 [m]
    pending_reset_sec: 0.25  # 発射枠内の微小振動・静止物リセットタイムアウト [s]
    pending_max_drop_m: 0.50  # 射出確定前にこの距離以上落下した候補を破棄する [m]

    # --- 6. 飛翔予測・異常候補の除外 ---
    gravity_m_s2: 9.81  # 予測に使う重力加速度 [m/s²]
    drag_coeff: 0.40  # 速度減衰係数 [1/s]。予測の前後・左右速度に適用する
    vel_smoothing_beta: 0.50  # 速度平滑化フィルタ係数 (0.0: 予測重視 〜 1.0: 観測重視)
    tube_radius_m: 0.65  # 予測位置から採用候補までの最大距離 [m]
    centroid_position_tolerance_m: 0.08  # 重心位置の計測誤差許容量 [m]
    max_total_accel_m_s2: 45.0  # 許容最大全加速度 [m/s^2]
    min_vertical_accel_m_s2: -35.0  # 許容下向き最大加速度 [m/s^2]
    max_lateral_accel_m_s2: 30.0  # 許容横方向最大加速度 [m/s^2]
    max_heading_deg: 55.0  # 許容最大進行偏向角 [deg]
    heading_min_speed_m_s: 0.2  # 進行方向の角度判定を有効にする最低速度 [m/s]
    heading_min_step_m: 0.05  # 進行方向の角度判定を行う最小移動量 [m]
    reject_ascent_after_apex: true  # 頂点通過後、鉛直ジッター許容を超える再上昇候補を除外する
    backward_jitter_tolerance_m: 0.04  # 飛翔中の許容最大後退ジッター [m]
    vertical_jitter_tolerance_m: 0.06  # 頂点通過後の許容鉛直ジッター [m]
    min_flight_vx_m_s: -1.50  # 飛翔中の前方速度の下限 [m/s]
    max_vx_m_s: 15.0  # 許容最大飛翔速度 Vx [m/s]
    max_abs_vy_m_s: 2.50  # 許容最大横方向速度 |Vy| [m/s]
    min_vz_m_s: -10.0  # 許容最小鉛直速度 Vz [m/s] (落下方向)
    max_vz_m_s: 8.0  # 許容最大鉛直速度 Vz [m/s] (上昇方向)
    abort_on_anomaly: true  # 物理条件に反する候補が続いたらLOSTとして打ち切る
    max_anomaly_frames: 2  # LOSTにするまでの連続異常候補数 [フレーム]
    max_lost_frames: 12  # このフレーム数を超えて見失うとLOST。LANDEDにはしない
    max_flight_duration_sec: 2.50  # 最大許容飛翔時間 [s] (滞空異常の安全タイムアウト)
    lost_frame_gate_expansion_m: 0.04  # 欠測1フレームあたりの予測ゲート拡張量 [m]
    max_gate_expansion_m: 0.10  # 欠測時のゲート拡張量の上限 [m]
    min_stationary_move_m: 0.10  # 静止判定移動量閾値 [m]
    max_stationary_frames: 8  # 静止判定フレーム数
    landing_min_z: 0.15  # この高さ以下の実測点を採用した場合のみLANDED [m]

    # --- 7. 間引き・クラスタ選択・GPUメモリ ---
    voxel_size_m: 0.02  # GPU ダウンサンプリングボクセルサイズ [m]
    cluster_eps_m: 0.10  # DBSCAN クラスタリング近傍探索距離 [m]
    min_cluster_points: 25  # 射出候補の最小点数 [点]
    min_tracking_points: 4  # 飛翔中の候補の最小点数 [点]
    max_cluster_points: 8000  # クラスタ最大点数
    min_cloth_size_m: 0.05  # 雑巾最小外形径 [m]
    max_cloth_size_m: 0.60  # 雑巾最大外形径 [m]
    prediction_distance_weight: 2.0  # 候補選択で予測位置からの距離に与える重み
    cluster_size_weight: 0.05  # 候補選択で点数に与える重み
    launch_forward_weight: 1.0  # 射出枠内の候補選択で前方位置を優先する重み
    max_voxel_points: 8192  # GPUに保持する間引き後の最大点数 [点]
    voxel_hash_table_size: 32768  # Voxelハッシュの要素数

    # --- 8. GPU深度背景差分 & 射出連携 ---
    use_bg_subtraction: true  # GPU深度リングバッファ背景差分を有効化
    bg_diff_thresh_m: 0.12  # 背景より手前にある動的物体のみ抽出するしきい値 [m]
    bg_update_interval_sec: 0.08  # 背景更新の最小間隔 [s]。追跡・射出確認中は更新しない
    bg_ring_frames: 6  # 背景作成用深度リングバッファフレーム数 (60fps時: 6フレーム=0.10秒)
    bg_pre_shot_exclude_sec: 0.08  # 射出検知時刻直前の除外ウィンドウ [s] (直近フレームを背景から除外)
    shot_window_sec: 2.5  # 射出後の背景凍結ウィンドウ時間 [s]
    shot_count_topic: /robot/feedback/shot_count  # 射出カウントトピック名
    reset_topic: /cloth/reset  # 追跡・背景リセットトピック名

    # --- 9. 外部通信・入力時刻 ---
    cropped_cloud_topic: /realsense/cropped_cloud  # 自己位置ノードへ送信するクロップ点群トピック
    dynamic_cloud_topic: /realsense/dynamic_cloud  # 自己位置ノードから受信する動的点群トピック
    external_filter_status_topic: /realsense/filter_status  # 自己位置フィルタ状態トピック
    external_prediction_topic: /cloth/filter_prediction  # 自己位置ノードへ送る予測保護球マーカー
    external_tracking_keep_radius_m: 0.30  # gn10へ送る予測保護球の半径 [m]
    external_result_timeout_sec: 0.25  # 動的抽出結果待機タイムアウト [s]
    external_poll_sec: 0.02  # ポーリング周期 [s]
    image_max_age_sec: 0.25  # 入力の撮影時刻とROS時計の最大許容差 [s]
    depth_queue_size: 8  # 深度画像の受信キュー長 [フレーム]
    publisher_queue_size: 10  # 通常の出力トピックのキュー長 [件]
    color_queue_size: 5  # カラー受信キュー長 [フレーム]
    bag_rewind_tolerance_sec: 0.5  # 時刻がこの値以上戻ったら追跡履歴をリセットする [s]

    # --- 10. 表示・実測出力・ログ ---
    debug_publish_hz: 5.0  # PC向け表示点群・ROIの最大配信頻度 [Hz]。追跡FPSは下げない
    publish_debug_cloud: true  # デバッグ用点群パブリッシュ
    trajectory_history_sec: 15.0  # RViz 軌跡描画履歴保持時間 [s]
    min_trajectory_step_m: 0.005  # 軌跡に点を追加する最小移動量 [m]
    max_trajectory_points: 1000  # 保持する軌跡の最大点数 [点]
    static_marker_interval_sec: 0.1  # 追跡終了後のマーカー再配信間隔 [s]
    landing_position_topic: /cloth/landing_position  # 着地推定位置パブリッシュトピック名
    warning_log_throttle_ms: 5000  # 警告の最小表示間隔 [ms]
    status_log_throttle_ms: 1000  # 状態ログの最小表示間隔 [ms]

    # --- 11. launchで起動する補助処理（Jetsonでは通常すべてfalse） ---
    start_rviz: false  # 同じPCでRVizも起動するか
    start_analyzer: false  # 軌道CSV解析ノードを同時起動するか
    record_inputs: false  # 入力・自己位置・追跡結果をrosbagへ記録するか
    record_topics:  # 記録するトピック（record_inputs=true時だけ使用）
      - /tf
      - /tf_static
      - /camera/camera/depth/image_rect_raw
      - /camera/camera/depth/camera_info
      - /cloth/position
      - /cloth/landing_position
      - /cloth/tracking_state
      - /robot/feedback/shot_count
