/**:
  ros__parameters:
    # カメラトピック設定 (D435 縦置き)
    depth_topic: "/camera/camera/depth/image_rect_raw"
    camera_info_topic: "/camera/camera/depth/camera_info"
    
    # 座標系
    target_frame: "base_link"
    camera_frame: "camera_depth_optical_frame"
    
    # 空間ROIフィルタ (ロボット機体および床・天井の除外)
    min_depth_m: 0.35        # ベルト先端直前の至近距離ノイズカット
    max_depth_m: 6.0         # 最大計測距離
    floor_height_m: -0.1     # 床面高さ（base_link基準）
    
    # 背景深度差分パラメータ
    diff_threshold_m: 0.12   # 背景より手前何mを動体とみなすか
    min_cluster_points: 30   # 布として認識する最小点群数
    max_cluster_points: 3000 # 最大点群数
    
    # 射出自動記録トリガー
    auto_record: true
    min_flight_duration_sec: 0.25
    save_directory: "/tmp/cloth_trajectories"
