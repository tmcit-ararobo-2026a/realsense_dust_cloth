/**:
  ros__parameters:
    # 追跡モード: 'pointcloud' または 'depth'
    tracking_mode: "pointcloud"

    # カメラトピック設定
    points_topic: "/camera/camera/depth/color/points"
    depth_topic: "/camera/camera/depth/image_rect_raw"
    camera_info_topic: "/camera/camera/depth/camera_info"
    
    # カメラ姿勢・オフセット
    camera_width: 848
    camera_height: 480
    camera_pitch_deg: 45.0
    camera_roll_deg: 90.0
    camera_height_offset_m: 0.35
    camera_x_offset_m: 0.25

    # CUDA / Direct API 設定
    use_direct_realsense: false
    publish_debug_cloud: false

    # 空間ROIフィルタ（base_link 基準）
    min_x_m: 0.30            # ベルト先端直前の至近距離ノイズカット
    max_x_m: 6.0             # 最大計測距離
    min_y_m: -1.5            # 左右制限
    max_y_m: 1.5
    min_z_m: 0.05            # 床面カット
    max_z_m: 3.5             # 天井カット
    
    # 点群クラスタリング & 雑巾判定パラメータ
    voxel_size_m: 0.03       # 3cm ボクセルダウンサンプリング (Jetson負荷抑制)
    cluster_eps_m: 0.15      # クラスタ探索距離 (m)
    min_cluster_points: 10   # 雑巾として認識する最小点群数
    max_cluster_points: 1500 # 最大点群数
    max_cloth_size_m: 0.65   # 最大3Dサイズ(m): スーパー雑巾(約0.6m)を許容し相手ロボット(>0.7m)を除外
    
    trajectory_history_sec: 3.0 # RViz残像表示秒数
