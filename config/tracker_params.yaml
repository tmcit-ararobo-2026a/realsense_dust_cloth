/**:
  ros__parameters:
    # =========================================================================
    # 【1. カメラ接続・トピック設定】
    # =========================================================================
    tracking_mode: "depth"                          # 追跡モード: 'depth' または 'pointcloud'
    points_topic: "/camera/camera/depth/color/points"
    depth_topic: "/camera/camera/depth/image_rect_raw"
    camera_info_topic: "/camera/camera/depth/camera_info"
    color_topic: "/camera/camera/color/image_raw"
    use_direct_realsense: true                     # true: librealsense2 C++ API直結, false: ROS 2トピック購読
    publish_debug_cloud: true                      # デバッグ点群(/cloth/debug/...)をパブリッシュするか

    # =========================================================================
    # 【2. カメラ取り付け位置・姿勢 (base_link 基準)】
    # ノード自身がこの設定から静的TF (base_link -> camera_link -> optical) を直接発行します
    # =========================================================================
    publish_static_tf: true                        # ノードから静的TFを発行するか (URDF側で発行する場合はfalse)
    camera_parent_frame: "base_link"
    camera_frame: "camera_link"
    camera_x_offset_m: 0.50                        # base_link からの前方オフセット (m)
    camera_height_offset_m: 1.00                   # base_link からのカメラ高さ (m)
    camera_pitch_deg: 20.0                         # 仰角 (度, 水平から上向き)
    camera_roll_deg: 90.0                          # 縦置きロール角 (度, 90.0: 時計回り縦置き)
    camera_width: 640                              # 解像度 幅 (px)
    camera_height: 480                             # 解像度 高さ (px)

    # =========================================================================
    # 【3. 空間ROIフィルタ (探索境界エリア, base_link 基準)】
    # =========================================================================
    min_x_m: 0.50                                  # 前方 最小 (m, ロボット手前の除外)
    max_x_m: 5.50                                  # 前方 最大 (m, 着地先境界までカバー)
    min_y_m: -1.20                                 # 左右幅 左側 (m)
    max_y_m: 1.20                                  # 左右幅 右側 (m)
    min_z_m: 0.08                                  # 高さ 最小 (m, 床面の反射ノイズをカット)
    max_z_m: 3.30                                  # 高さ 最大 (m, 最高到達点をカバー)
    min_depth_m: 0.25                              # カメラ最短深度 (m)
    max_depth_m: 3.80                              # カメラ最長深度 (m, 遠方赤外線フリッカー遮断)

    # =========================================================================
    # 【4. 発射口検知ゲート (弾道ステートマシン)】
    # =========================================================================
    enable_ballistic_filter: true                  # 弾道フィルタ有効化 (静止ノイズを遮断し飛翔体のみロック)
    launch_min_x: 0.50                             # 発射口エリア X 最小 (m, 発射口手前)
    launch_max_x: 0.90                             # 発射口エリア X 最大 (m, 発射口奥・小さな発射口に絞り込み)
    launch_min_y: -0.20                            # 発射口エリア Y 最小 (m)
    launch_max_y: 0.20                             # 発射口エリア Y 最大 (m)
    launch_min_z: 1.10                             # 発射口エリア Z 最小 (m)
    launch_max_z: 1.50                             # 発射口エリア Z 最大 (m)
    min_launch_vx: 0.50                            # 発射判定 最小前進速度 (m/s)
    min_launch_move_m: 0.08                        # 静止ノイズの揺れを無視するための前進距離 (m)
    gate_radius_m: 0.90                            # 探索ゲート半径 (m, 高速移動時の予測円)
    max_lost_frames: 15                            # 見失い許容フレーム数 (一時的な深度欠損を許容)
    landing_min_z: 0.05                            # 着地確定判定高さ (m, 床面到達まで追尾継続)
    drag_coeff: 0.40                               # 空気抵抗減衰係数
    vel_smoothing_beta: 0.50                       # 速度平滑化ブレンド率
    max_vx_m_s: 15.0                               # 飛翔最大前進速度上限 (m/s)

    # =========================================================================
    # 【5. 背景差分 (静止物除去)】
    # =========================================================================
    use_bg_subtraction: true                       # 静止した床・壁・天井を消去 (移動射撃時はfalse推奨)
    bg_diff_thresh_m: 0.12                         # 背景より12cm手前に現れた動く物体のみ抽出 (m, RealSenseの深度ブレ6〜10cmを遮断)
    bg_target_frames: 30                           # 背景学習フレーム数 (起動直後の背景学習を30フレームに安定化)

    # =========================================================================
    # 【6. 点群クラスタリング & 雑巾抽出】
    # =========================================================================
    voxel_size_m: 0.02                             # ボクセル間引きサイズ (m, 2cm)
    cluster_eps_m: 0.22                            # DBSCANクラスタ探索距離 (m, 高速時に点群がバラけても1つの塊に繋げる)
    min_cluster_points: 12                         # 雑巾クラスタ最小点数 (高速で点群が薄くなっても拾えるよう設定)
    max_cluster_points: 8000                       # 雑巾クラスタ最大点数
    max_cloth_size_m: 0.75                         # 雑巾最大3D対角サイズ (m, 人間や壁などの巨大ノイズはカット)
    trajectory_history_sec: 15.0                   # RViz軌跡残像の保持秒数 (s)

    # =========================================================================
    # 【7. カラー映像配信設定 (Wi-Fi 遠隔監視 / rosbag 軽量記録)】
    # =========================================================================
    enable_color_stream: true                      # カラー映像の配信
    color_fps: 30                                  # カラーフレームレート (fps)
    jpeg_quality: 65                               # JPEG圧縮品質 (1-100)
    color_rotation_deg: 90                         # 縦置きカメラ映像の回転角 (90度縦置きカメラの映像を正立表示)

    # =========================================================================
    # 【8. 高速飛翔 & ノイズ除去 詳細チューニング】
    # =========================================================================
    pending_reset_sec: 0.20                        # 発射ゲート内の基準点リセット時間 (s)
    min_tracking_points: 8                         # 追尾中(TRACKING)に維持する最小点数 (高速時は8〜10)
    min_cloth_size_m: 0.05                         # 雑巾の最小3Dサイズ (m, これ未満の微小ゴミ塊を除外)
    continuity_thresh_m: 0.30                      # 隣り合うピクセルとの許容深度差 (m)
    continuity_min_neighbors: 2                    # 4方向のうち繋がっているべき最小方向数
    reject_uncalibrated_bg: true                   # 背景学習時に深度0(欠損)だった遠方ピクセルのノイズを遮断するか
    uncalibrated_bg_max_depth_m: 2.0               # 背景未計測ピクセルを許容する最大距離 (m)

    # =========================================================================
    # 【9. RealSense ハードウェア高速撮影設定】
    # =========================================================================
    depth_fps: 60                                  # Depthフレームレート (60 または 90 ※USB3.0必須)
    rs_laser_power: -1.0                           # 赤外線レーザー出力 (-1.0で自動的に最大出力に設定し点群欠損を防ぐ)
    rs_exposure_us: -1                             # Depthシャッタースピード (-1: 自動露出, 高速残像対策時は 3000〜5000 を指定)
