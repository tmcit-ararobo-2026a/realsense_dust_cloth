# ==============================================================================
# realsense_dust_cloth: Unity シミュレーション設定パラメータ (Unity Simulation)
# Unity 連携時、自己位置推定ノード (gn10_pointcloud_localization) との動的背景除去連携プロファイル
# ==============================================================================
#
# ------------------------------------------------------------------------------
# 【現場チューニング早見表：雑巾が追跡できないときの対処法】
# ------------------------------------------------------------------------------
# ① 発射したのに IDLE のまま反応しない（発射検知されない）:
#    - min_cluster_points を 45 -> 25〜30 に下げる（発射口での初期点数しきい値を緩和）
#    - min_launch_move_m を 0.12 -> 0.08 に下げる（発射判定の前進距離を緩和）
#    - min_launch_vx を 0.50 -> 0.30 に下げる（射出初速判定を緩和）
#    - launch_min_x〜launch_max_z の発射枠を発射口の実測位置に合わせて広げる
#
# ② 飛翔の途中で切れて LOST になる（途中で見失う）:
#    - min_tracking_points を 12 -> 6〜8 に下げる（最重要：遠くの薄い点群でも継続追跡）
#    - max_lost_frames を 8 -> 12〜15 に増やす（一時的なオクルージョン・ブレへの許容度向上）
#    - gate_radius_m を 0.45 -> 0.55〜0.60 に広げる（予測とのズレ許容度を拡大）
#    - drag_coeff を 0.40 -> 0.60〜0.80 に上げる（実際の布が予測より手前で失速している場合）
#
# ③ 光や床のノイズに吸い寄せられて軌道が折れ曲がる（光ジッターに誘引される）:
#    - min_flight_vx_m_s を 0.00 に設定（後退を完全排除）
#    - min_z_m を 0.12 -> 0.15 に引き上げる（床面反射ノイズを物理カット）
#    - max_cloth_size_m を 0.80 -> 0.50〜0.60 に絞る（巨大な床面・壁面クラスタを排除）
#    - gate_radius_m を 0.45 に絞る（周囲の無関係な光ノイズを包含させない）
#
# ④ 地面に落ちても LANDED にならない:
#    - landing_min_z を min_z_m + 0.03m 程度（例: min_z_m: 0.12 なら 0.15）に合わせる
# ------------------------------------------------------------------------------

/**:
  ros__parameters:

    # --------------------------------------------------------------------------
    # 1. 基本実行設定 (Core Execution)
    # --------------------------------------------------------------------------
    use_sim_time: true                      # Unity シミュレーション時刻を使用
    observed_landing_only: true             # 厳格着地判定: true の場合、実測点群が着地高度に達した時のみ LANDED / landing_position を発行

    # --------------------------------------------------------------------------
    # 2. カメラ入力・シミュレーション設定
    # --------------------------------------------------------------------------
    use_direct_realsense: false             # ROS 2 トピック (/camera/camera/depth/image_rect_raw) から深度を受信
    depth_topic: /camera/camera/depth/image_rect_raw    # Unity が配信する深度トピック名
    camera_info_topic: /camera/camera/depth/camera_info # カメラ内部パラメータトピック名
    color_topic: /camera/camera/color/image_raw         # カラー画像トピック名
    depth_fps: 60                           # 深度フレームレート [fps]
    color_fps: 30                           # カラーフレームレート [fps]
    jpeg_quality: 65                        # RViz 向け JPEG 圧縮品質 (1-100)
    color_rotation_deg: 90                  # 画像回転角 [deg]
    rs_laser_power: -1.0                    # レーザー出力 (シミュレーション時は無視)
    rs_exposure_us: -1                      # 露光時間 (シミュレーション時は無視)
    enable_color_stream: true               # カラー画像配信の有効化

    # --------------------------------------------------------------------------
    # 3. カメラ設置姿勢 (Static TF Extrinsics: base_link -> camera_link)
    # --------------------------------------------------------------------------
    publish_static_tf: true                 # カメラ固定 TF をトラッカーノードから配信
    camera_parent_frame: base_link          # 親座標系
    camera_frame: camera_link               # カメラ座標系名
    camera_x_offset_m: 0.50                 # 前後オフセット [m]
    camera_height_offset_m: 1.00            # 高さオフセット [m]
    camera_pitch_deg: 20.0                  # 仰角・見下ろし角 [deg]
    camera_roll_deg: 90.0                   # 縦置き回転角 [deg]
    camera_width: 640                       # 深度画像幅 [px]
    camera_height: 480                      # 深度画像高さ [px]

    # --------------------------------------------------------------------------
    # 4. 追跡対象空間 (ROI Bounding Box: base_link 基準)
    # --------------------------------------------------------------------------
    min_x_m: 0.60                           # 探索空間 X 下限 (前方) [m]
    max_x_m: 6.00                           # 探索空間 X 上限 (前方) [m]
    min_y_m: -0.60                          # 探索空間 Y 下限 (右側) [m]
    max_y_m: 0.60                           # 探索空間 Y 上限 (左側) [m]
    min_z_m: 0.12                           # 探索空間 Z 下限 [m] (床面カット)
    max_z_m: 3.10                           # 探索空間 Z 上限 [m] (天井カット)
    min_depth_m: 0.25                       # カメラ最小計測深度 [m]
    max_depth_m: 5.50                       # カメラ最大計測深度 [m]

    # --------------------------------------------------------------------------
    # 5. 射出検出ゲート (Launch Detection Gate)
    # --------------------------------------------------------------------------
    enable_ballistic_filter: true           # 弾道フィルタ・射出ゲート判定の有効化
    launch_min_x: 0.80                      # 発射判定ボックス X 下限 [m]
    launch_max_x: 1.35                      # 発射判定ボックス X 上限 [m]
    launch_min_y: -0.25                     # 発射判定ボックス Y 下限 [m]
    launch_max_y: 0.18                      # 発射判定ボックス Y 上限 [m]
    launch_min_z: 1.45                      # 発射判定ボックス Z 下限 [m]
    launch_max_z: 2.10                      # 発射判定ボックス Z 上限 [m]
    min_launch_vx: 0.50                     # 射出認定最小前方初速 [m/s]
    min_launch_move_m: 0.12                 # 射出認定最小前方変位 [m]
    pending_reset_sec: 0.20                 # 発射枠内微小振動リセットタイムアウト [s]

    # --------------------------------------------------------------------------
    # 6. 弾道物理推定 & カルマンフィルタ (Ballistic Tracking)
    # --------------------------------------------------------------------------
    gate_radius_m: 0.45                     # 予測位置からの追跡ゲート球半径 [m]
    max_lost_frames: 8                      # 追跡ロスト認定までの最大連続見失いフレーム数
    min_tracking_points: 8                  # 飛翔中に追跡継続と認める最小点数
    landing_min_z: 0.15                     # 着地認定高さ [m]
    drag_coeff: 0.40                        # 空気抵抗係数 [1/m]
    vel_smoothing_beta: 0.50                # 速度平滑化フィルタ係数 (0.0: 予測重視 〜 1.0: 観測重視)
    min_flight_vx_m_s: 0.00                 # 許容最小飛翔速度 Vx [m/s] (前進のみ許可、後退完全排除)
    max_vx_m_s: 15.00                       # 許容最大飛翔速度 Vx [m/s]
    max_abs_vy_m_s: 3.50                    # 許容最大横方向速度 |Vy| [m/s]
    min_vz_m_s: -10.00                      # 許容最小鉛直速度 Vz [m/s]
    max_vz_m_s: 12.00                       # 許容最大鉛直速度 Vz [m/s]
    max_flight_duration_sec: 2.50           # 最大許容飛翔時間 [s]
    landing_position_topic: /cloth/landing_position # 着地推定位置パブリッシュトピック名
    trajectory_history_sec: 15.0            # RViz 軌跡描画履歴保持時間 [s]
    publish_debug_cloud: false              # デバッグ用点群パブリッシュ (通常運用は false)

    # --------------------------------------------------------------------------
    # 7. GPU クラスタリング (CUDA DBSCAN & 雑巾サイズ判定)
    # --------------------------------------------------------------------------
    voxel_size_m: 0.02                      # GPU ダウンサンプリングボクセルサイズ [m]
    cluster_eps_m: 0.10                     # DBSCAN クラスタリング近傍探索距離 [m]
    min_cluster_points: 35                  # 有効クラスタ認定最小点数
    max_cluster_points: 12000               # 有効クラスタ認定最大点数
    min_cloth_size_m: 0.05                  # 雑巾最小外形径 [m]
    max_cloth_size_m: 0.80                  # 雑巾最大外形径 [m]
    continuity_thresh_m: 0.08               # 点群連続性判定距離閾値 [m]
    continuity_min_neighbors: 3             # 連続性認定最小近傍点数
    min_stationary_move_m: 0.12             # 静止判定移動量閾値 [m]
    max_stationary_frames: 5                # 静止判定フレーム数

    # --------------------------------------------------------------------------
    # 8. 自己位置推定 ESDF 動的背景除去連携 (External Filter Interface)
    # --------------------------------------------------------------------------
    tracking_input_mode: external_dynamic_cloud # 入力モード: 外部動的点群を使用
    cropped_cloud_topic: /realsense/cropped_cloud # 自己位置ノードへ送信するクロップ点群トピック
    dynamic_cloud_topic: /realsense/dynamic_cloud # 自己位置ノードから受信する動的点群トピック
    external_filter_status_topic: /realsense/filter_status # 自己位置フィルタ状態トピック
    external_prediction_topic: /cloth/filter_prediction    # 自己位置ノードへ送る予測保護球マーカー
    external_result_timeout_sec: 0.25       # 動的抽出結果待機タイムアウト [s]
    external_poll_sec: 0.02                 # ポーリング周期 [s]
    external_tracking_keep_radius_m: 0.50   # 予測マーカー周辺の動的点保護半径 [m]
    map_frame: map                          # 静的マップ座標系名
    map_max_image_age_sec: 0.25             # 画像タイムスタンプ最大許容遅延 [s]
    map_depth_queue_size: 8                 # 内部キューサイズ
